<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | CampusFix</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-nav"></header>

  <main class="form-wrap">
    <div class="card form-card">
      <h2>Create your account</h2>
      <p class="sub">Join CampusFix in under a minute</p>

      <div id="alert" class="form-alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Your full name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="6+ chars, letters and numbers" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" placeholder="Re-enter password" />
        </div>
        <div class="form-group">
          <label for="role">I am a</label>
          <select id="role">
            <option value="student">Student</option>
            <option value="admin">Admin / Staff</option>
          </select>
        </div>
        <div class="form-group" id="code-group" style="display:none">
          <label for="code">Admin access code</label>
          <input type="text" id="code" placeholder="Ask your campus office" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>

      <p class="form-footer">Already registered? <a href="login.html">Login</a></p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    redirectIfLoggedIn();

    // show admin code box only when Admin is selected
    document.getElementById("role").addEventListener("change", function () {
      document.getElementById("code-group").style.display = this.value === "admin" ? "block" : "none";
    });

    document.getElementById("register-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        showAlert("alert", "error", "Passwords do not match.");
        return;
      }

      const result = registerUser({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: password,
        role: document.getElementById("role").value,
        code: document.getElementById("code").value,
      });

      if (!result.ok) {
        showAlert("alert", "error", result.msg);
        return;
      }
      showAlert("alert", "success", "Account created! Redirecting to login...");
      setTimeout(() => (window.location.href = "login.html"), 1000);
    });
  </script>
</body>
</html>
