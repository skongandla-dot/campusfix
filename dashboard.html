<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard | CampusFix</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-nav"></header>

  <main class="container">
    <div class="page-header">
      <h1 id="welcome">My Dashboard</h1>
      <p>Report a new problem and track the ones you have already submitted.</p>
    </div>

    <section class="grid grid-4" id="stats"></section>

    <div class="dash-layout">
      <!-- Report form -->
      <aside class="card">
        <h2 style="margin-bottom:14px">Report an issue</h2>
        <div id="alert" class="form-alert"></div>
        <form id="issue-form" novalidate>
          <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="e.g. WiFi not working in Block 32" />
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">Select category</option>
              <option>WiFi / Internet</option>
              <option>Electricity</option>
              <option>Water</option>
              <option>Hostel</option>
              <option>Classroom</option>
              <option>Mess / Food</option>
              <option>Cleanliness</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" placeholder="e.g. Block 32, Room 101" />
          </div>
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" placeholder="Explain the problem clearly..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Submit issue</button>
        </form>
      </aside>

      <!-- My issues -->
      <section>
        <h2 style="margin-bottom:14px">My issues</h2>
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search by title, place or details..." />
          <select id="filter-status">
            <option value="">All status</option>
            <option>Pending</option>
            <option>In Progress</option>
            <option>Resolved</option>
          </select>
          <select id="filter-category">
            <option value="">All categories</option>
            <option>WiFi / Internet</option>
            <option>Electricity</option>
            <option>Water</option>
            <option>Hostel</option>
            <option>Classroom</option>
            <option>Mess / Food</option>
            <option>Cleanliness</option>
            <option>Other</option>
          </select>
        </div>
        <div class="issue-list" id="issue-list"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/issues.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
