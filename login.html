<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | CampusFix</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-nav"></header>

  <main class="form-wrap">
    <div class="card form-card">
      <h2>Welcome back</h2>
      <p class="sub">Login to report and track campus issues</p>

      <div id="alert" class="form-alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <p class="form-footer">New here? <a href="register.html">Create an account</a></p>
      <p class="form-footer"><small>Demo admin: admin@campusfix.com / Admin@123</small></p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const result = loginUser(email, password);

      if (!result.ok) {
        showAlert("alert", "error", result.msg);
        return;
      }
      showAlert("alert", "success", "Login successful! Redirecting...");
      setTimeout(() => {
        window.location.href = result.role === "admin" ? "admin.html" : "dashboard.html";
      }, 700);
    });
  </script>
</body>
</html>
